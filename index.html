<!doctype html>
<html lang="es-PE">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#e4f1eb" />
		<title>Estudanza</title>

		<!-- La raiz replica el reenvio que el dominio tenia en GoDaddy: quien
		     entra a estudanza.com termina en el Facebook de la academia.
		     Pages no hace redirecciones de servidor, asi que se resuelve en el
		     cliente: location.replace para no dejar este paso en el historial
		     (evita que el boton atras rebote), meta refresh para quien tenga
		     el JS desactivado, y un enlace visible si fallaran ambos.

		     El programa de la gala vive aparte, en /grangalaclassique2026/, y
		     no pasa por aqui. -->
		<meta http-equiv="refresh" content="0; url=https://www.facebook.com/PatriciaCano.Ballet" />
		<meta name="robots" content="noindex" />
		<link rel="icon" href="grangalaclassique2026/assets/images/logo-estudanza.webp" type="image/webp" />

		<style>
			body {
				margin: 0;
				min-height: 100svh;
				display: grid;
				place-content: center;
				gap: 1rem;
				padding: 2rem;
				background: #e4f1eb;
				color: #55605b;
				font: 1rem/1.6 Arial, Helvetica, sans-serif;
				text-align: center;
			}

			a {
				color: #2e6a5c;
			}
		</style>

		<script>
			location.replace("https://www.facebook.com/PatriciaCano.Ballet");
		</script>
	</head>

	<body>
		<p>Redirigiendo…</p>
		<p><a href="https://www.facebook.com/PatriciaCano.Ballet">Ir al Facebook de Estudanza</a></p>
	</body>
</html>
